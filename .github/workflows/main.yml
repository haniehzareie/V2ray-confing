name: V2ray Finder

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: pip install requests
      - name: Run
        run: python Finder.py
      - name: Save
        run: |
          git config user.name "bot"
          git config user.email "bot@user.com"
          git add Germany_vless.txt
          git diff --staged --quiet || git commit -m "update"
          git push
