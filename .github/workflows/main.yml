name: Run V2ray Finder

on:
  schedule:
    # هر ۱۵ دقیقه یکبار اجرا شود (زمان UTC)
    - cron: '*/15 * * * *'
  workflow_dispatch:  # امکان اجرای دستی از تب Actions

jobs:
  find-vless:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests
    
    - name: Run Finder script
      run: |
        python Finder.py
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add Germany_vless.txt
        git diff --staged --quiet || git commit -m "Auto-update: V2ray configs $(date '+%Y-%m-%d %H:%M:%S')"
        git push
